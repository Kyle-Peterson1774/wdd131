<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temple Album | Kyle</title>
  <meta name="description" content="A responsive temple picture album for WDD 131.">
  <meta name="author" content="Kyle">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Lato:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/temples.css">
  <link rel="stylesheet" href="styles/temples-large.css">

  <script src="scripts/temples.js" defer></script>
</head>
<body>
  <header>
    <div class="header-bar">
      <span class="site-title">Temple Album</span>
      <button id="menu" aria-label="Toggle navigation menu" aria-expanded="false">&#9776;</button>
    </div>
    <nav class="navigation">
      <a href="#" class="active">Home</a>
      <a href="#">Old</a>
      <a href="#">New</a>
      <a href="#">Large</a>
      <a href="#">Small</a>
    </nav>
  </header>

  <main>
    <h1>Home</h1>
    <div class="album">
      <figure>
        <img src="images/accra_ghana_temple_lds.jpeg" alt="Accra Ghana Temple" width="400" height="250" loading="lazy">
        <figcaption>Accra Ghana Templ</figcaption>
      </figure>
      <figure>
        <img src="images/brasilia_brazil_temple_exterior.png" alt="brasilia brazil temple" width="400" height="250" loading="lazy">
        <figcaption>Brasilia Brazil Temple</figcaption>
      </figure>
      <figure>
        <img src="images/exterior_grounds_rome_italy_temple.jpeg" alt="Rome Italy Temple" width="400" height="250" loading="lazy">
        <figcaption>Rome Italy Temple</figcaption>
      </figure>
      <figure>
        <img src="images/gilbert_arizona_temple_exterior.jpeg" alt="Gilbert Arizona Temple" width="400" height="250" loading="lazy">
        <figcaption>Gilbert Arizona Temple</figcaption>
      </figure>
      <figure>
        <img src="images/hong_kong_china_temple.png" alt="Hong Kong China Temple" width="400" height="250" loading="lazy">
        <figcaption>Hong Kong China Temple</figcaption>
      </figure>
      <figure>
        <img src="images/logan_utah_temple.jpeg" alt="Logan Utah Temple" width="400" height="250" loading="lazy">
        <figcaption>Logan Utah Temple</figcaption>
      </figure>
      <figure>
        <img src="images/salt_lake_temple.jpeg" alt="Salt Lake Temple" width="400" height="250" loading="lazy">
        <figcaption>Salt Lake Temple</figcaption>
      </figure>
      <figure>
        <img src="images/snowflake_temple_lds.jpeg" alt="Snowflake Temple" width="400" height="250" loading="lazy">
        <figcaption>Snowflake Temple</figcaption>
      </figure>
      <figure>
        <img src="images/tucson_arizona_temple_exterior.jpeg" alt="Tucson Arizona Temple" width="400" height="250" loading="lazy">
        <figcaption>Tucson Arizona Temple</figcaption>
      </figure>
    </div>
  </main>

  <footer>
    <p>&copy;<span id="currentyear"></span> Kyle Nevada</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
